{{ define "main" }}
<div class="max-w-4xl mx-auto">
    
    <header class="mb-10 border-b pb-4">
        <h1 class="text-3xl font-bold text-gray-900 capitalize">
            {{ .Title }}
        </h1>
        {{ if .Content }}
        <div class="mt-4 prose text-gray-600">
            {{ .Content }}
        </div>
        {{ end }}
    </header>

    <div class="grid gap-8 md:grid-cols-2">
        {{ range .Pages }}
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
            <h2 class="text-2xl font-bold mb-2 text-gray-800">
                <a href="{{ .RelPermalink }}" class="hover:text-blue-600">
                    {{ .Title }}
                </a>
            </h2>
            
            <div class="text-sm text-gray-500 mb-4">
                {{ .Date.Format "Jan 2, 2006" }}
            </div>

            <p class="text-gray-600 mb-4 line-clamp-3">
                {{ .Description | default .Summary }}
            </p>

            <a href="{{ .RelPermalink }}" class="text-blue-600 font-semibold text-sm hover:underline">
                Read Article &rarr;
            </a>
        </div>
        {{ end }}
    </div>

</div>
{{ end }}
