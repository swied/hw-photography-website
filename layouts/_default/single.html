{{ define "main" }}
<article class="bg-white p-6 md:p-10 rounded-lg shadow-sm">
    
    <header class="mb-8 text-center">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">{{ .Title }}</h1>
        <time class="text-sm text-gray-500 font-medium">
            {{ .Date.Format "January 2, 2006" }}
        </time>
    </header>

    <div class="prose prose-lg prose-blue max-w-none mx-auto">
        {{ .Content }}
    </div>

</article>
{{ end }}
