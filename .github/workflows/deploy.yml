name: Deploy Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [gcs-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # <--- UPDATED: Cancels overlapping builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python for Sync Engine
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Deps
        run: |
          pip install google-cloud-storage Pillow

      # Google Cloud Auth
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The Core Logic: Generates JSON data from GCS
      - name: Run Sync Engine
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          python scripts/sync_engine.py --mode public

      # Generate Hugo Pages for each gallery found in JSON
      - name: Generate Gallery Stubs
        run: |
          mkdir -p site/content/gallery
          python -c "import json, os; 
          data_path='site/data/photos.json';
          print(f'Checking {data_path}...');
          if os.path.exists(data_path):
              data=json.load(open(data_path)); 
              [open(f'site/content/gallery/{g[\"id\"]}.md', 'w').write(f'---\ntitle: {g[\"title\"]}\n---') for g in data['galleries']]
          else:
              print('No photos.json found, skipping stub generation.')"

      # Node.js for Tailwind CSS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build CSS
        working-directory: ./site
        run: |
          npm install
          npm run build:css

      # Hugo Build
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.110.0'
          extended: true

      - name: Build Site
        working-directory: ./site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4